# Perfil "local": para trabajar desde casa con MariaDB instalada en tu compu.
# Se activa con la variable de entorno SPRING_PROFILES_ACTIVE=local
#
# Usuario y clave de tu MariaDB local por variables de entorno (sin guardarlas en el repo):
#   DB_USER      (por defecto: root)
#   DB_PASSWORD  (por defecto: vacía)

spring.datasource.url=jdbc:mariadb://localhost:3306/etec_anotame
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# En local Hibernate crea/actualiza las tablas a partir de las entidades,
# así no hace falta tener el esquema armado a mano como en el servidor de la escuela.
spring.jpa.hibernate.ddl-auto=update
