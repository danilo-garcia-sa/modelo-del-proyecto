spring.application.name=etec-anotame
spring.profiles.active=${SPRING_PROFILES_ACTIVE:lab}

# Conexión al servidor de la escuela (perfil "lab", el de por defecto).
# La contraseña NO se guarda en el repo: se pasa por variable de entorno DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mariadb://10.9.120.5:3306/Anotame-UBA}
spring.datasource.username=${DB_USER:anotame}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Datos de prueba: apagado por defecto. En el perfil "local" se enciende solo;
# en la escuela se puede encender con la variable de entorno ANOTAME_SEED_ENABLED=true
anotame.seed.enabled=${ANOTAME_SEED_ENABLED:false}

logging.pattern.console=%5p | %t | %c{36} | %m%n
